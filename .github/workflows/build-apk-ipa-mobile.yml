name: All Builds (APK, AAB, IPA)

on:
  # Runs on push to any of the below branches
  push:
    branches:
    - master
  # Runs on pull request events that target one of the below branches
  pull_request:
    branches:
    - master

  # Allows you to run this workflow manually from the Actions tab of the repository
  workflow_dispatch:
    inputs:
      BUILD_VERSION:
        description: 'Versió de la construcció (ex: 0.2.0)'
        required: true
        default: '0.2.0'
      BUILD_NUMBER:
        description: 'Build Number - Número de build (ex: 1)'
        required: true
        default: '1'
      CREATE_RELEASE:
        description: 'Crear release a GitHub?'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write
  actions: read

env:
  # https://flet.dev/docs/publish#versioning
  PROJECT_NAME: Near_Here
  PYTHON_VERSION: 3.12.7
  FLUTTER_VERSION: 3.24.5

jobs:
  build-aab:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}

    - name: Setup Java JDK
      uses: actions/setup-java@v4.5.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Flet Build AAB
      run: |
        flutter config --no-analytics
        flet build aab -vv --build-number=${{ github.event.inputs.BUILD_NUMBER || '0' }} --build-version=${{ github.event.inputs.BUILD_VERSION || '0.2.0' }}

    - name: Upload AAB Artifact
      uses: actions/upload-artifact@v4.4.3
      with:
        name: aab-build-artifact
        path: build/aab
        if-no-files-found: warn
        overwrite: false

  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}

    - name: Setup Java JDK
      uses: actions/setup-java@v4.5.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Flet Build APK
      run: |
        flutter config --no-analytics
        flet build apk -vv --build-number=${{ github.event.inputs.BUILD_NUMBER || '0' }} --build-version=${{ github.event.inputs.BUILD_VERSION || '0.2.0' }} --no-android-splash

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4.4.3
      with:
        name: apk-build-artifact
        path: build/apk
        if-no-files-found: warn
        overwrite: false

  build-ipa:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}

    - name: Flet Build IPA
      run: |
        flutter config --no-analytics
        flet build ipa -vv --build-number=${{ github.event.inputs.BUILD_NUMBER || '0' }} --build-version=${{ github.event.inputs.BUILD_VERSION || '0.2.0' }} --no-ios-splash

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4.4.3
      with:
        name: ipa-build-artifact
        path: build/ipa
        if-no-files-found: warn
        overwrite: false

    - name: Create Payload Directory
      if: github.event.inputs.CREATE_RELEASE == 'true' || github.event_name == 'push'
      run: mkdir Payload

    - name: Move Runner.app to Payload
      if: github.event.inputs.CREATE_RELEASE == 'true' || github.event_name == 'push'
      run: mv build/ipa/Runner.xcarchive/Products/Applications/Runner.app Payload/

    - name: Package IPA
      if: github.event.inputs.CREATE_RELEASE == 'true' || github.event_name == 'push'
      run: zip -r Near_Here-${{ github.event.inputs.BUILD_VERSION || '0.2.0' }}.ipa Payload

  create-release:
    needs: [build-apk, build-aab, build-ipa]
    runs-on: ubuntu-latest
    if: github.event.inputs.CREATE_RELEASE == 'true' || github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download APK Artifact
      uses: actions/download-artifact@v4
      with:
        name: apk-build-artifact
        path: ./apk

    - name: Download AAB Artifact
      uses: actions/download-artifact@v4
      with:
        name: aab-build-artifact
        path: ./aab

    - name: Download IPA Artifact
      uses: actions/download-artifact@v4
      with:
        name: ipa-build-artifact
        path: ./ipa

    - name: Create GitHub Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.event.inputs.BUILD_VERSION || '0.2.0' }}
        name: Release ${{ github.event.inputs.BUILD_VERSION || '0.2.0' }}
        draft: false
        prerelease: true
        body: |
          ## Near Here v${{ github.event.inputs.BUILD_VERSION || '0.2.0' }}
          
          ### Formats disponibles:
          - **APK**: Per a Android (instal·lació directa)
          - **AAB**: Per a Google Play Store
          - **IPA**: Per a iOS (necessita signatura o SideStore)
          
          ### Build Information:
          - Build Number: ${{ github.event.inputs.BUILD_NUMBER || '0' }}
          - Build Version: ${{ github.event.inputs.BUILD_VERSION || '0.2.0' }}
          - Python: ${{ env.PYTHON_VERSION }}
          - Flutter: ${{ env.FLUTTER_VERSION }}
        files: |
          apk/**/*.apk
          aab/**/*.aab
          ipa/**/*.ipa
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
