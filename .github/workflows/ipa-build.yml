name: IPA Build

on:
  # Runs on push to any of the below branches
  push:
    branches:
      - main

  # Runs on pull request events that target one of the below branches
  pull_request:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab of the repository
  workflow_dispatch:
    inputs:
      BUILD_VERSION:
        description: 'Versió de la construcció (ex: 1.0.0)'
        required: true
        default: '1.0.0'
      BUILD_NUMBER:
        description: 'Build Number - Número de build (ex: 1)'
        required: true
        default: '1'

permissions:
  contents: write
  actions: read

env:
  # https://flet.dev/docs/publish#versioning
  PYTHON_VERSION: 3.12.8

  # flet-cli version to install for `flet build`
  FLET_CLI_VERSION: 0.27.5

  # Ensures Python uses UTF-8 encoding by default
  PYTHONUTF8: 1

  # Disables rich text formatting in Flet CLI output
  FLET_CLI_NO_RICH_OUTPUT: 1

  # Disables progress bars when using UV
  UV_NO_PROGRESS: 1

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install flet-cli ${{ env.FLET_CLI_VERSION }}
      run: |
        python -m pip install --upgrade pip
        pip install flet-cli==$FLET_CLI_VERSION

    - name: Install Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'

    - name: Configure Flutter
      run: flutter config --no-analytics

    - name: Install Python Dependencies
      run: pip install -r requirements.txt

    - name: Flet Build IPA
      run: |
        flet build ipa --verbose --build-number=${{ github.event.inputs.BUILD_NUMBER || '1' }} --build-version=${{ github.event.inputs.BUILD_VERSION || '1.0.0' }}

    - name: Create Payload Directory
      if: success()
      run: |
        mkdir -p Payload
        # Find and move the .app bundle
        APP_PATH=$(find build -name "*.app" -type d | head -n 1)
        if [ -n "$APP_PATH" ]; then
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
        else
          echo "No .app bundle found"
          exit 1
        fi

    - name: Package IPA
      if: success()
      run: |
        zip -r Near_Here-${{ github.event.inputs.BUILD_VERSION || '1.0.0' }}.ipa Payload
        ls -lh Near_Here-${{ github.event.inputs.BUILD_VERSION || '1.0.0' }}.ipa

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4.3.4
      with:
        name: ipa-build-artifact
        path: |
          Near_Here-*.ipa
          build/ipa
        if-no-files-found: warn
        overwrite: false
    
    - name: Create GitHub Release
      if: success()
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.event.inputs.BUILD_VERSION || '1.0.0' }}
        name: Release ${{ github.event.inputs.BUILD_VERSION || '1.0.0' }}
        draft: false
        prerelease: true
        body: |
          ## Near Here v${{ github.event.inputs.BUILD_VERSION || '1.0.0' }} - IPA Build
          
          ### Format:
          - **IPA**: Per a iOS (necessita signatura per instal·lar o SideStore)
          
          ### Build Information:
          - Build Number: ${{ github.event.inputs.BUILD_NUMBER || '1' }}
          - Build Version: ${{ github.event.inputs.BUILD_VERSION || '1.0.0' }}
          - Python: ${{ env.PYTHON_VERSION }}
          - Flutter: 3.24.5
          - Flet CLI: ${{ env.FLET_CLI_VERSION }}
          
          ### Nota Important:
          Aquest IPA no està signat. Per instal·lar-lo necessitaràs:
          - **SideStore** o **AltStore** per a side-loading
          - **Xcode** per signar-lo manualment
          - Un certificat de desenvolupador vàlid
          
        files: |
          Near_Here-${{ github.event.inputs.BUILD_VERSION || '1.0.0' }}.ipa
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}