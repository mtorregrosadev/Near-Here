name: IPA Build

on:
  # Runs on push to any of the below branches
  push:
    branches:
      - master
  # Runs on pull request events that target one of the below branches
  pull_request:
    branches:
      - master

  # Allows you to run this workflow manually from the Actions tab of the repository
  workflow_dispatch:
    inputs:
      BUILD_VERSION:
        description: 'Versió de la construcció'
        required: true
        default: '0.2'  # Valor per defecte
      BUILD_NUMBER:
        description: 'Build Number - Versió de la build'
        required: true
        default: '0'  # Valor per defecte

permissions:
  contents: write  # Permet escriptura als continguts del repositori
  actions: read    # Permet lectura de les accions

env:
  # https://flet.dev/docs/publish#versioning
  PYTHON_VERSION: 3.12.2
  FLUTTER_VERSION: 3.24.0

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}

    - name: Install CocoaPods Dependencies
      run: |
        cd ios
        pod install

    - name: Flet Build IPA
      run: |
        flutter config --no-analytics
        flet build ipa --verbose --build-number=${{ inputs.BUILD_NUMBER }} --build-version=${{ inputs.BUILD_VERSION }} --include-packages flet_geolocator flet_lottie

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4.3.4  # https://github.com/marketplace/actions/upload-a-build-artifact
      with:
        name: ipa-build-artifact  # the name of the artifact
        path: build/ipa  # location of Flet build output
        if-no-files-found: error  # Fail the action with an error message if no files are found
        overwrite: false  # If true, an artifact with a matching name will be deleted before a new one is uploaded. If false, the action will fail if an artifact for the given name already exists. Does not fail if the artifact does not exist.
    
    - name: Create Payload Directory
      run: mkdir Payload

    - name: Move Runner.app to Payload
      run: mv build/ipa/Runner.xcarchive/Products/Applications/Runner.app Payload/

    - name: Package Payload Directory
      run: zip -r Near_Here-${{ inputs.BUILD_VERSION }}.ipa Payload
    
    - name: Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ inputs.BUILD_VERSION }}
        release_name: Release ${{ inputs.BUILD_VERSION }}
        draft: false
        prerelease: true

    - name: Upload IPA to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: Near_Here-${{ inputs.BUILD_VERSION }}.ipa
        asset_name: Near_Here-${{ inputs.BUILD_VERSION }}.ipa
        asset_content_type: application/octet-stream
